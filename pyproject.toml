[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "smart-file-organizer"
version = "0.1.0"
description = "A Python tool for organizing files and identifying duplicates."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
dependencies = []

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
]

[project.scripts]
smart-file-organizer = "filecleaner.cli:main"

[tool.setuptools.packages.find]
include = ["filecleaner*"]

[tool.pytest.ini_options]
testpaths = ["tests"]